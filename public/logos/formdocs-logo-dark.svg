<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 150" width="780" height="150">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap');
    </style>
  </defs>

  <!-- Dark background -->
  <rect width="780" height="150" rx="0" fill="#191919"/>

  <!-- === ICON === -->
  <g transform="translate(16, 16)">
    
    <!-- Back document (offset, dark elevated surface) -->
    <rect x="16" y="5" width="68" height="92" rx="6" fill="#252525" stroke="#333333" stroke-width="1.2"/>
    
    <!-- Front document body -->
    <path d="
      M6,10 
      Q6,4 12,4 
      L58,4 
      L78,24 
      L78,98 
      Q78,104 72,104 
      L12,104 
      Q6,104 6,98 
      Z
    " fill="#1E1E1E" stroke="#FFFFFFD1" stroke-width="1.8" stroke-linejoin="round"/>
    
    <!-- Corner fold -->
    <path d="M58,4 L58,18 Q58,24 64,24 L78,24" fill="#2A2A2A" stroke="#FFFFFFD1" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Checkbox 1: checked -->
    <rect x="18" y="36" width="12" height="12" rx="2.5" fill="#FFFFFFD1"/>
    <polyline points="21,42 24,46 28,39" fill="none" stroke="#191919" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="36" y1="42" x2="64" y2="42" stroke="#FFFFFF26" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Checkbox 2: checked -->
    <rect x="18" y="56" width="12" height="12" rx="2.5" fill="#FFFFFFD1"/>
    <polyline points="21,62 24,66 28,59" fill="none" stroke="#191919" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="36" y1="62" x2="56" y2="62" stroke="#FFFFFF26" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Checkbox 3: empty -->
    <rect x="18" y="76" width="12" height="12" rx="2.5" fill="none" stroke="#FFFFFF40" stroke-width="1.5"/>
    <line x1="36" y1="82" x2="60" y2="82" stroke="#FFFFFF15" stroke-width="4" stroke-linecap="round"/>

    <!-- Blue arrow -->
    <g transform="translate(80, 42)">
      <line x1="0" y1="0" x2="18" y2="0" stroke="#2383E2" stroke-width="2.2" stroke-linecap="round"/>
      <polyline points="14,-5 20,0 14,5" fill="none" stroke="#2383E2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Generated doc -->
    <g transform="translate(104, 26)">
      <rect x="0" y="0" width="28" height="36" rx="4" fill="#1E1E1E" stroke="#FFFFFFD1" stroke-width="1.5"/>
      <line x1="6" y1="9" x2="22" y2="9" stroke="#FFFFFFB0" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
      <line x1="6" y1="16" x2="18" y2="16" stroke="#FFFFFFB0" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
      <line x1="6" y1="23" x2="20" y2="23" stroke="#FFFFFFB0" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
      <rect x="5" y="28" width="18" height="4" rx="2" fill="#2383E2"/>
    </g>
  </g>

  <!-- === WORDMARK === -->
  <text transform="translate(168, 115)"
        font-family="'Inter', 'Segoe UI', system-ui, sans-serif"
        font-size="132" letter-spacing="-6">
    <tspan font-weight="700" fill="#FFFFFFEB">Form</tspan><tspan font-weight="400" fill="#FFFFFFD1">docs</tspan>
  </text>

  <!-- Tagline -->
  <text x="172" y="140"
        font-family="'Inter', 'Segoe UI', system-ui, sans-serif"
        font-size="12" font-weight="500" fill="#FFFFFF50" letter-spacing="2.8">
    FORMS · QUOTES · DOCUMENTS
  </text>

</svg>
