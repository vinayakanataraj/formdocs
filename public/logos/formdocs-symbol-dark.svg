<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">

  <!-- Dark background -->
  <rect width="140" height="140" fill="#191919"/>

  <!-- === ICON === -->
  <g transform="translate(6, 12)">
    
    <!-- Back document (offset, dark elevated surface) -->
    <rect x="22" y="5" width="78" height="104" rx="7" fill="#252525" stroke="#333333" stroke-width="1.3"/>
    
    <!-- Front document body -->
    <path d="
      M8,11 
      Q8,4 15,4 
      L68,4 
      L92,28 
      L92,112 
      Q92,119 85,119 
      L15,119 
      Q8,119 8,112 
      Z
    " fill="#1E1E1E" stroke="#FFFFFFD1" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Corner fold -->
    <path d="M68,4 L68,20 Q68,28 76,28 L92,28" fill="#2A2A2A" stroke="#FFFFFFD1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Checkbox 1: checked -->
    <rect x="22" y="42" width="14" height="14" rx="3" fill="#FFFFFFD1"/>
    <polyline points="25.5,49 29,53.5 33,45.5" fill="none" stroke="#191919" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="43" y1="49" x2="76" y2="49" stroke="#FFFFFF26" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Checkbox 2: checked -->
    <rect x="22" y="65" width="14" height="14" rx="3" fill="#FFFFFFD1"/>
    <polyline points="25.5,72 29,76.5 33,68.5" fill="none" stroke="#191919" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="43" y1="72" x2="68" y2="72" stroke="#FFFFFF26" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Checkbox 3: empty -->
    <rect x="22" y="88" width="14" height="14" rx="3" fill="none" stroke="#FFFFFF40" stroke-width="1.6"/>
    <line x1="43" y1="95" x2="72" y2="95" stroke="#FFFFFF15" stroke-width="5" stroke-linecap="round"/>

    <!-- Blue arrow -->
    <g transform="translate(94, 48)">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#2383E2" stroke-width="2.5" stroke-linecap="round"/>
      <polyline points="15,-6 22,0 15,6" fill="none" stroke="#2383E2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Generated doc (small) -->
    <g transform="translate(100, 62)">
      <rect x="0" y="0" width="26" height="34" rx="4" fill="#1E1E1E" stroke="#FFFFFFD1" stroke-width="1.6"/>
      <line x1="5.5" y1="9" x2="20" y2="9" stroke="#FFFFFFB0" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
      <line x1="5.5" y1="15.5" x2="16" y2="15.5" stroke="#FFFFFFB0" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
      <line x1="5.5" y1="22" x2="18" y2="22" stroke="#FFFFFFB0" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
      <rect x="5" y="26.5" width="16" height="4" rx="2" fill="#2383E2"/>
    </g>
  </g>

</svg>
